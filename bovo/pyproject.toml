[project]
name = "bovo-planning-manager"
version = "1.0.0"
description = "Logiciel professionnel de gestion des interventions ASF — BOVO Planning Manager."
authors = [{ name = "HENRI Dylan" }]
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["database", "exports", "logs", "sample"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ANN", "BLE"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "E402"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503", "ANN101"]
exclude = ["database", "exports", "logs", "sample"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
exclude = "(database|exports|logs|sample|tests)"

[tool.pytest.ini_options]
testpaths = ["tests"]
