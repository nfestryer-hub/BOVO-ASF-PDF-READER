services:
  db:
    image: postgres:16-alpine
    container_name: bovo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bovo}
      POSTGRES_USER: ${POSTGRES_USER:-bovo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bovo} -d ${POSTGRES_DB:-bovo}"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: bovo-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DSN: "postgresql+psycopg://${POSTGRES_USER:-bovo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bovo}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET manquant (générer avec: openssl rand -hex 32)}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-Bovo}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD manquant}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-*}"
      ACCESS_TOKEN_MINUTES: "${ACCESS_TOKEN_MINUTES:-480}"
      REFRESH_TOKEN_DAYS: "${REFRESH_TOKEN_DAYS:-30}"
      ENVIRONMENT: "${ENVIRONMENT:-production}"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - documents:/data/documents

  # Sauvegarde automatique quotidienne de PostgreSQL (07:00 UTC).
  # Conserve les 14 dernières archives compressées.
  backup:
    image: postgres:16-alpine
    container_name: bovo-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "while true; do
        DAY=$$(date +%F);
        pg_dump -h db -U ${POSTGRES_USER:-bovo} ${POSTGRES_DB:-bovo}
          | gzip -9 > /backups/bovo-$$DAY.sql.gz;
        ls -1t /backups/bovo-*.sql.gz | tail -n +15 | xargs -r rm --;
        echo \"[backup] $$DAY OK\";
        sleep 86400;
      done"

volumes:
  db-data:
  documents:
  backups:
